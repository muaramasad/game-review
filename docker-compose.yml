services:
  backend-tools:
    image: node:20
    working_dir: /app
    volumes:
      - ./backend:/app
    profiles: ["tools"]

  frontend-tools:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    profiles: ["tools"]

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_PATH: /app/data/game-review.sqlite
    volumes:
      - sqlite-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite-data:
